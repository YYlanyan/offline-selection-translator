<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>离线划词</title><style>body{width:340px;margin:0;padding:20px;box-sizing:border-box;font:14px/1.7 system-ui;color:#203c40;background:#f5f8f7}h1{font-size:20px;margin:0}button,select{font:inherit;padding:8px;border-radius:8px;border:1px solid #ccdcd8;margin:5px 0;width:100%;background:white}button{cursor:pointer}button:disabled{opacity:.5}p{margin:8px 0;overflow-wrap:anywhere}small{color:#647c7a}hr{border:0;border-top:1px solid #dce7e4;margin:16px 0}</style>
<h1>离线划词</h1><p id="site">正在读取当前网站…</p><p id="site-status" role="status"></p>
<label>网站模式<select id="mode"><option value="all">全部启用</option><option value="blacklist">黑名单：排除名单内网站</option><option value="whitelist">白名单：仅名单内网站启用</option></select></label>
<label>加入黑名单的时长<select id="black-duration"><option value="permanent">永久</option><option value="15">15 分钟</option><option value="60">1 小时</option><option value="1440">1 天</option><option value="10080">7 天</option><option value="custom">自定义</option></select></label><label id="custom-duration-label" hidden>自定义时长（分钟）<input id="custom-duration" type="number" min="1" max="525600" step="1" value="30" style="width:100%;box-sizing:border-box;padding:8px"></label><button id="black" disabled>当前网站加入黑名单</button><button id="white" disabled>当前网站加入白名单</button><button id="remove" disabled>移除当前网站匹配的名单规则</button>
<small>按当前域名及其子域名生效。加入名单会同时切换到对应模式；白名单模式会禁用名单外网站。移除规则可能同时影响其覆盖的其他子域名。</small>
<hr><label>窗口位置<select id="window-mode"><option value="follow">跟随选区</option><option value="fixed">固定位置</option></select></label>
<hr><p id="translation-status" role="status">正在检查模型…</p><button data-direction="en-zh">准备英中模型</button><button data-direction="zh-en">准备中英模型</button><button id="settings">更多设置 / 词库管理</button>
<script src="preferences.js"></script><script type="module" src="popup.js"></script><script type="module" src="translator.js"></script></html>
